notes = "M10e: all of the file, under nfsserver (sys/conf/files): every server procedure (nfsrv3_access, getattr, setattr, lookup, readlink, read, write, create, mknod, remove, rename, link, symlink, mkdir, rmdir, readdir, readdirplus, commit, statfs, fsinfo, pathconf, null, noop), nfsrv_access, the inline helpers (nfsm_reply, nfsm_srvmtofh1/2, nfsm_srvnamesiz, nfsm_srvpostop_fh), and the NfsrvProc type of nfs_syscalls.c's nfsrv3_procs[] (NFSRV3_PROCS lives in nfs_syscalls.rs, as in C). Procedures return Result<(), Errno> (Ok = the C's 0, reply in *mrq; Err = dropped); the reply status stays the C's int (errno or NFS status, as nfs_namei/nfsrv_fhtovp return it); nfsm_reply returns the build cursor or None where the C returns non-zero, and a failed reply header (MGETHDR) drops the request with ENOBUFS; a request without nd_nam fails the port check (NFSERR_AUTHERR | AUTH_TOOWEAK); M_TEMP buffers are Vecs; MGET/MCLGET failures reply ENOBUFS (read frees its first reply before the error reply, the C leaks it); fixed C leaks: a GUARDED create of an existing file left it locked, the directory of a failed lookup when nfsm_reply returns non-zero (create, mknod, mkdir, rmdir, rename), and rename's nfsmout (the XXX workaround kept a reference of the source directory, and the saved name); create's device path does not free the name buffer the file system already freed after a failed VOP_MKNOD (a C double free) and its goto nfsmout after nfsm_reply is version 2 only (returns); ni_pathlen is reset before the second vfs_lookup of create/mknod/symlink (the C's size_t wraps); readdir stops at an entry with a zero d_reclen or past the buffer. Faithful C quirks kept: EXCLUSIVE create stores the verifier in va_atime.tv_sec with tv_nsec VNOVAL, so ufs_setattr ignores it and a retransmission is EEXIST; LINK of a directory replies OK without linking; a v3 SYMLINK without a mode makes a bad inode. Host tests: readdir packing and sizes, flrep layout, null/noop/garbage/short/no-address requests, and every procedure against an exported ffs (v2 and v3 replies decoded, error statuses, nfsmout paths, reference counts checked by a clean unmount)"


