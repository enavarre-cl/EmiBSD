notes = "M10e: every function of the file is ported, gated as the C (nfs_receive/nfs_reply/nfs_request nfsclient; nfsrv_rcv/nfsrv_getstream/nfsrv_dorec/nfsrv_wakenfsd nfsserver; the rest for either). nfsrv_dorec takes its descriptors from nfs_syscalls.rs's NFSRV_DESCRIPT_PL. Result<_, Errno> throughout: nfs_sigintr Err(EINTR) for nonzero, nfs_rcvlock Err(EALREADY); a v3 reply status that is no errno (10001..) comes out of nfs_request as EIO. Lock words are &Cell<i32> (nm_flag or ns_solock). MGET/m_copym/M_PREPEND/pool_get with M_WAIT can fail here: ENOBUFS where the C path returns an error, R_MUSTRESEND for a failed first send copy, nfs_realign leaves the chain as is (dissect views copy bytes). nfs_rephead returns (mreq, mb) and builds the header with nfsm_build; nfsrv_dorec returns the descriptor; nfs_getreq has_header bool, nd_retxid host order as the C. Frees what the C leaks: the reply of a MSG_DENIED RPC (nfs_request), a partial chain/address with an soreceive error (nfsrv_rcv); a datagram without an address is queued as its own record (the C dereferences NULL). Host tests: RTT estimator, flag locks and nfs_sigintr, nfs_realign (strict alignment test seam), nfs_rephead layouts, nfs_getreq (v2/v3, AUTH_UNIX, RPC errors, EBADRPC), nfsrv_getstream (records, fragments, EPERM); M11e: nfsrv_rcv runs under the kernel lock as in C"

