notes = "M11a: the whole file: cpu_implementers[] and the cpu_cores_*[] tables, CPU_IMPL/PART/VAR/REV, cpu_model (CPU_MODEL; kern_sysctl.rs does not read it yet), cpu_node, cpu_id_aa64* (atomics), arm64_has_lse/rng/aes, cpu_rng (RNDRRS/RNDR by encoding, cpu_rng_to), cpu_mitigate_spectre_v2/bhb/v4 and cpu_mitigate_cve_2025_10263, cpu_identify (the core line, the caches from CLIDR/CCSIDR with CCIDX, the mismatch checks, the ID register features through a FeatureLine printer, the SVE line), cpu_identify_cleanup (the userland view, hwcap/hwcap2 into exec_elf.rs's HWCAP/HWCAP2; autoconf.rs calls it), cpu_classify, cpu_ca/cpu_cd with cpu_match/cpu_attach ('cpu0 at mainbus0 mpidr 0: ARM Cortex-A72 r0p3'; cpu0 at mainbus? and, MULTIPROCESSOR, cpu* at mainbus? in ioconf.rs), cpu_init (TTBR0/T0SZ/TCR_A1, PAN, DIT, PAuth, BTI, SVE, MDSCR/OSLAR) on the boot CPU and every AP, cpu_flush_bp_noop/psci, cpu_serror_apple, cpu_clockspeed; MULTIPROCESSOR: AP cpu_info from malloc linked into cpu_info_list and cpu_info[] (machdep.rs), ncpus, enable-method, clockqueue_init/sched_init_cpu, the CPUF_IDENTIFY handshake, cpu_boot_secondary_processors, cpu_start_secondary, cpu_boot_secondary (CPUF_GO, dsb/sev, ARM_IPI_NOP, wait CPUF_RUNNING), cpu_init_secondary (identify, CPUF_GO, cpu_init, the idle thread's switchframe, splhigh, arm_intr_cpu_enable, cpu_startclock, CPUF_RUNNING, spllower, sched_toidle), cpu_halt, cpu_kick, cpu_unidle (moved from machdep.rs); SUSPEND: cpu_suspend_cycle/cpu_suspend_cycle_fcn ported, cpu_init_primary, cpu_suspend_primary and cpu_resume_secondary reported (SUSPEND not configured, M14); the OPP code (cpu_opp_init, cpu_opp_setperf, the cooling levels ported; cooling_device_register, cpu_opp_mountroot and cpu_opp_dotask reported: ofw_thermal/ofw_clock/ofw_regulator and cpu_setperf are not ported); cpu_psci_init (psci_features reported, only with cpu-idle-states) and cpu_psci_idle_cycle (psci_cpu_suspend reported); kstats (NKSTAT 0: kstat is not configured, cpu_kstat_attach/cpu_opp_kstat_attach report it). Deviations: the APs start through the boot protocol (BootMp kept by initarm as machdep BOOT_MP; cpu_start_secondary matches the node's reg to BootCpu.hwid & MPIDR_AFF and calls mp.start(i, ci)), replacing PSCI CPU_ON / the spin table into locore.S's cpu_hatch_secondary; cpu_hatch_entry does start_mmu's work from statics (the boot CPU's MAIR/TCR/SCTLR/TTBR1, TTBR0 = pm_pt0pa, local tlbi) plus initarm's (SPSel, TPIDR_EL1, VBAR_EL1, CPACR as fpu_drop leaves it), then switches to ci_el1_stkend; NPSCI is 0 (psci.c not ported): smccc_enable_arch_workaround_2 is reported at the boot CPU's attach; trampoline.S is not ported so ci_trampoline_vectors records a TRAMPOLINE_VECTORS_* number; codepatch_nop(CPTAG_REPEAT_TLBI) has nothing to patch (the TLBIs never repeat yet); NXCALL 0; feature qemu: a self-check in cpu_boot_secondary/cpu_init_secondary (a kernel window remapped while each AP hatches: the broadcast TLBI must reach it) and an ARM_IPI_NOP to each AP ('cpu: 3 of 3 application processors running, tlb shootdown seen by 3, ipi nop seen by 3' with -smp 4); M11e: cpu_hatch_entry enables the generic timer event stream before cpu_init_secondary's wfe waits for CPUF_IDENTIFY/CPUF_GO (QEMU TCG lost-sev stall; see agtimer.c)."

