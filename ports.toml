notes = "M12, whole: umass_match/attach/detach/disco, the polled-transfer iteration, setup of bulk and control transfers, umass_adjust_transfer (UFI, ATAPI), endpoint stall clearing, the Bulk-Only (BBB) transfer, state machine, CSW checks and reset recovery, the CBI/CBI_I transfer, ADSC, state machine, status block and Command Block Reset, Get Max LUN. Not ported: UMASS_DEBUG (option absent: umassdebug, states[], umass_bbb_dump_cbw/csw, umass_dump_buffer), the #if 0 umass_reset and residue check. Deviations in the file: the command is a slice cut to CBWCDBLENGTH (the C overruns CBWCDB); the copies between the caller's buffer and the DMA buffer are bounded by transfer_datalen and UMASS_MAX_TRANSFER_SIZE (a BBB residue larger than the transfer copies nothing; the C memcpy gets a negative length); the fall-through switches are a loop over a match; dCBWtag is a static AtomicU32; umass_detach returns Result. Tested in QEMU (qemu-xhci + usb-storage, --smp 4, both archs): SCSI over Bulk-Only, polled probe (INQUIRY, READ CAPACITY) and interrupt-driven reads and writes through sd(4) and msdosfs (mount_msdos, cat, cksum of 1 MiB, cp, cmp); CBI/CBI_I, UFI/ATAPI and the stall/reset recovery paths are ported but not exercised (QEMU's stick is BBB/SCSI and does not stall)"

