# autoinstall(8) answers for the OpenBSD VM of `cargo xtask diff-openbsd`. `{template}` and
# `{sets}` are filled in by diffopenbsd.rs; these comment lines are dropped. The installed disk
# is sd0, the install image sd1 (diffopenbsd.rs, `openbsd_qemu`). The image's set directory
# has no SHA256.sig for the installer to check; the whole image was checked against the
# snapshot's SHA256 file before it was used (`fetch`), so the sets are installed without it.
System hostname = openbsd
Network interfaces = vio0
IPv4 address for vio0 = autoconf
IPv6 address for vio0 = none
Password for root account = emibsd
Start sshd(8) by default = no
Do you expect to run the X Window System = no
Change the default console to com0 = yes
Which speed should com0 use = 115200
Setup a user = no
Allow root ssh login = no
What timezone are you in = UTC
Which disk is the root disk = sd0
URL to autopartitioning template for disklabel = {template}
Location of sets = disk
Is the disk partition already mounted = no
Which disk contains the install media = sd1
Which sd1 partition has the install sets = a
Pathname to the sets = {sets}
Set name(s) = -all bsd* base* comp*
Continue without verification = yes
